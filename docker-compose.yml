services:
  meta-panel:
    image: ghcr.io/meta-smart-factory-d-o-o/panel-setup:latest
    container_name: meta-panel
    network_mode: host
    restart: always
    env_file: .env
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - meta-data:/opt/meta/data
      - meta-logs:/opt/meta/logs
      # Persistent system.ini — first run is generated from template + env,
      # subsequent runs reuse the same file. To override completely, mount
      # your own system.ini here (read-only):
      #   - ./system.ini:/opt/meta/conf/system.ini:ro
      - meta-conf:/opt/meta/conf
    privileged: true

volumes:
  meta-data:
  meta-logs:
  meta-conf:
